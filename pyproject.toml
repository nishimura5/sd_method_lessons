[project]
name = "sd-method-lessons"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "factor-analyzer==0.5.1",
    "matplotlib==3.10.8",
    "numpy==2.4.2",
    "ordinalcorr==0.7.0",
    "pandas==3.0.1",
    "scikit-learn==1.5.2",
    "scipy==1.17.1",
]

[tool.uv]
exclude-newer = "30 days"

[tool.ruff]
line-length = 120

[dependency-groups]
dev = [
    "pyinstaller>=6.11.0",
    "pyinstaller-versionfile>=2.1",
    "pytest>=8.3",
]

[project.scripts]
sd-method-lessons = "sdanalysis_kun.cli:main"
sdanalysis-kun = "sdanalysis_kun.cli:main"

[project.gui-scripts]
sd-method-lessons-gui = "sdanalysis_kun.cli:main"
sdanalysis-kun-gui = "sdanalysis_kun.cli:main"

[tool.hatch.version]
path = "src/sdanalysis_kun/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/sdanalysis_kun"]
